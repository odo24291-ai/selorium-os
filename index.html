
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101114">
  <title>Solarium OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop">
    <header class="topbar">
      <div class="brand">SOLARIUM</div>
      <div id="clock">00:00</div>
    </header>

    <section class="welcome">
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1>Welcome to Solarium.</h1>
      <p>A different kind of desktop.</p>
    </section>

    <div class="dock">
      <button class="app" data-app="files">▤</button>
      <button class="app" data-app="terminal">⌘</button>
      <button class="app" data-app="settings">⚙</button>
      <button class="app" data-app="about">ⓘ</button>
    </div>

    <div id="window-area"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
