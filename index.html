
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solarium OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="desktop">

    <header class="topbar">
      <div class="panel-left">
        <button id="activities">Activities</button>
        <span>Applications</span>
      </div>
      <div id="clock">00:00</div>
      <div class="panel-right">
        <span>Wi-Fi</span>
        <span>Volume</span>
        <span>Power</span>
      </div>
    </header>

    <section class="welcome">
      <p class="eyebrow">SOLARIUM LINUX DESKTOP</p>
      <h1>Welcome to Solarium.</h1>
      <p>A different kind of desktop.</p>
    </section>

    <section id="overview" class="overview hidden">
      <input id="app-search" placeholder="Search applications..." autocomplete="off">
      <div id="app-grid"></div>
      <button id="close-overview">Back to desktop</button>
    </section>

    <div class="dock">
      <button class="app" data-app="files" title="Files">▤</button>
      <button class="app" data-app="terminal" title="Terminal">⌘</button>
      <button class="app" data-app="settings" title="Settings">⚙</button>
      <button class="app" data-app="about" title="About">ⓘ</button>
    </div>

    <div id="window-area"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
